<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اجرلي</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#06687A">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--bg:#F3F6F6;--card:#fff;--ink:#10222A;--mute:#5B6E75;--line:#DCE4E6;--brand:#06687A;--accent:#FF9F33;--warn:#FFE9D2;--warnink:#7A3B00;--bad:#B3261E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1A1F;--card:#12272E;--ink:#EAF1F2;--mute:#9DB2B8;--line:#24404A;--brand:#043F4B;--warn:#3a2410;--warnink:#FFC999;--bad:#FF8A80}}
:root[data-theme="dark"]{--bg:#0B1A1F;--card:#12272E;--ink:#EAF1F2;--mute:#9DB2B8;--line:#24404A;--brand:#043F4B;--warn:#3a2410;--warnink:#FFC999;--bad:#FF8A80}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',Tahoma,Arial,sans-serif;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 96px}
header{background:var(--brand);color:#fff;padding:22px 0 18px}
header .wrap{padding-bottom:0}
h1{margin:0;font-size:2.6rem;font-weight:800;color:var(--accent);letter-spacing:-.5px;line-height:1.1}
header p{margin:4px 0 14px;color:#DDF3F6;font-size:.95rem}
.search{width:100%;border:0;border-radius:12px;padding:12px 14px;font:inherit;background:#fff;color:#10222A}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 16px;font:inherit;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;display:grid;grid-template-columns:52px 1fr;gap:12px}
.ico{width:52px;height:52px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:1.7rem}
.card h2{margin:0;font-size:1.05rem;font-weight:600}
.meta{color:var(--mute);font-size:.88rem}
.price{font-weight:800;color:var(--brand)}
:root[data-theme="dark"] .price{color:var(--accent)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .price{color:var(--accent)}}
.note{margin:6px 0 0;font-size:.9rem}
.tag{display:inline-block;background:var(--warn);color:var(--warnink);border-radius:6px;padding:0 8px;font-size:.75rem;margin-inline-start:6px}
.acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;font:inherit;text-decoration:none;cursor:pointer;font-size:.92rem}
.btn.main{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.wa{background:#1FA855;color:#fff;border-color:#1FA855}
.btn.quiet{color:var(--mute);margin-inline-start:auto}
.btn:focus-visible,.chip:focus-visible,.fab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.empty{text-align:center;color:var(--mute);padding:40px 12px}
.notice{margin-top:20px;background:var(--warn);color:var(--warnink);border-radius:12px;padding:12px 14px;font-size:.88rem}
.fab{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:608px;margin:0 auto;background:var(--accent);color:#10222A;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer}
dialog{border:0;border-radius:16px;padding:18px;width:min(92vw,520px);background:var(--card);color:var(--ink);font-family:inherit}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{margin:0 0 10px}
label{display:block;font-size:.9rem;margin-top:10px}
input,select,textarea{width:100%;margin-top:4px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:var(--bg);color:var(--ink)}
.err{color:var(--bad);font-size:.88rem;min-height:1.3em;margin-top:8px}
.row{display:flex;gap:8px;margin-top:8px}.row .btn{flex:1;text-align:center}
.toast{position:fixed;inset-inline:0;bottom:90px;margin:auto;width:max-content;max-width:90vw;background:#10222A;color:#fff;border-radius:10px;padding:10px 16px;display:none;z-index:9}
@media(prefers-reduced-motion:no-preference){.toast.show{animation:t .2s ease-out}@keyframes t{from{opacity:0;transform:translateY(8px)}}}
</style>
</head>
<body>
<header><div class="wrap">
<h1>اجرلي</h1>
<p>أجّر أو استأجر ماطور، سيارة، أو بايسكل بكل محافظات العراق</p>
<input id="q" class="search" type="search" placeholder="ابحث: نوع، منطقة، موديل" aria-label="بحث">
<select id="gov" class="search" aria-label="المحافظة" style="margin-top:8px"></select>
</div></header>
<main class="wrap">
<div class="chips" id="chips"></div>
<div id="list"></div>
<div class="notice">اجرلي لوحة إعلانات فقط. الاتفاق والدفع والتسليم يتم بين المالك والمستأجر على مسؤوليتهما. تأكد من الهوية وملكية المركبة قبل أي إيجار.</div>
</main>
<button class="fab" id="add">انشر إعلان</button>

<dialog id="dlg">
<h3>انشر إعلان تأجير</h3>
<label>نوع المركبة<select id="f-type"><option>ماطور</option><option>سيارة</option><option>بايسكل</option></select></label>
<label>العنوان<input id="f-title" maxlength="60" placeholder="مثال: ماطور هوندا 125"></label>
<label>السعر باليوم (دينار)<input id="f-price" inputmode="numeric" placeholder="15000"></label>
<label>المحافظة<select id="f-gov"></select></label>
<label>المنطقة<input id="f-area" maxlength="40" placeholder="مثال: الموصل الجديدة"></label>
<label>رقم الهاتف<input id="f-phone" inputmode="tel" placeholder="07701234567"></label>
<label>ملاحظات<textarea id="f-note" rows="2" maxlength="140" placeholder="الشروط، التأمين، ساعات التسليم"></textarea></label>
<div class="err" id="err" role="alert"></div>
<div class="row"><button class="btn main" id="save">انشر الإعلان</button><button class="btn" id="cancel">إلغاء</button></div>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
var KEY='ajirli:listings',ICON={'ماطور':'🛵','سيارة':'🚗','بايسكل':'🚲'},TYPES=['الكل','ماطور','سيارة','بايسكل'];
var GOV=['بغداد','نينوى','البصرة','أربيل','السليمانية','دهوك','كركوك','الأنبار','صلاح الدين','ديالى','بابل','كربلاء','النجف','القادسية','واسط','ميسان','ذي قار','المثنى','حلبجة'];
var items=[],type='الكل',reported={},uid=null,db=null;
function $(i){return document.getElementById(i)}
function el(t,c,x){var n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n}
function wa(p){var d=String(p).replace(/\D/g,'');if(d[0]==='0')d='964'+d.slice(1);return 'https://wa.me/'+d}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';t.classList.remove('show');void t.offsetWidth;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display='none'},2400)}
function chips(){var c=$('chips');c.textContent='';TYPES.forEach(function(t){var b=el('button','chip',t);b.setAttribute('aria-pressed',t===type);b.onclick=function(){type=t;chips();render()};c.appendChild(b)})}
function render(){
var q=$('q').value.trim(),L=$('list');L.textContent='';
var r=items.filter(function(i){return (type==='الكل'||i.type===type)&&(!$('gov').value||i.gov===$('gov').value)&&(!q||(i.title+' '+i.area+' '+i.note+' '+i.type+' '+(i.gov||'')).indexOf(q)>-1)});
if(!r.length){L.appendChild(el('div','empty','ما أكو إعلانات هنا بعد. كن أول من ينشر إعلان!'));return}
r.forEach(function(i){
var c=el('article','card'),b=el('div');
c.appendChild(el('div','ico',ICON[i.type]||'🛵'));
var h=el('h2','',i.title);if(i.sample)h.appendChild(el('span','tag','تجريبي'));
b.appendChild(h);
b.appendChild(el('div','meta',i.type+' - '+(i.gov?i.gov+' - ':'')+i.area));
b.appendChild(el('div','price',Number(i.price).toLocaleString('en-US')+' د.ع / يوم'));
if(i.note)b.appendChild(el('p','note',i.note));
c.appendChild(b);
var a=el('div','acts'),call=el('a','btn main','اتصال');call.href='tel:'+i.phone;
var w=el('a','btn wa','واتساب');w.href=wa(i.phone);w.target='_blank';w.rel='noopener';
a.appendChild(call);a.appendChild(w);
if(i.ownerId&&i.ownerId===uid){var d=el('button','btn quiet','حذف إعلاني');d.onclick=function(){db.collection('listings').doc(i.id).delete().then(function(){toast('تم حذف الإعلان')}).catch(function(){toast('تعذر الحذف')})};a.appendChild(d)}
else{var p=el('button','btn quiet',reported[i.id]?'تم الإبلاغ':'بلاغ');p.onclick=function(){reported[i.id]=1;p.textContent='تم الإبلاغ';toast('وصلنا البلاغ، شكراً');try{db.collection('reports').add({listingId:i.id,createdAt:firebase.firestore.FieldValue.serverTimestamp()})}catch(e){}};a.appendChild(p)}
c.appendChild(a);L.appendChild(c)})}
function fill(id,first){var n=$(id);if(first){var o=el('option','',first);o.value='';n.appendChild(o)}GOV.forEach(function(g){var o=el('option','',g);o.value=g;n.appendChild(o)})}
fill('gov','كل المحافظات');fill('f-gov');
$('gov').onchange=render;
$('q').oninput=render;
$('add').onclick=function(){$('err').textContent='';$('dlg').showModal()};
$('cancel').onclick=function(){$('dlg').close()};
$('save').onclick=function(){
var t=$('f-title').value.trim(),p=parseInt($('f-price').value.replace(/\D/g,''),10),a=$('f-area').value.trim(),ph=$('f-phone').value.trim();
if(!t||!a)return $('err').textContent='اكتب العنوان والمنطقة.';
if(!p||p<1)return $('err').textContent='اكتب السعر بالأرقام، مثال: 15000.';
if(ph.replace(/\D/g,'').length<10)return $('err').textContent='رقم الهاتف لازم يكون 10 أرقام على الأقل.';
if(!uid)return $('err').textContent='جاري الاتصال، جرّب بعد ثواني.';
$('save').disabled=true;
db.collection('listings').add({type:$('f-type').value,title:t,price:p,gov:$('f-gov').value,area:a,phone:ph,note:$('f-note').value.trim(),ownerId:uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()}).then(function(){['f-title','f-price','f-area','f-phone','f-note'].forEach(function(i){$(i).value=''});$('dlg').close();toast('تم نشر الإعلان')}).catch(function(){$('err').textContent='تعذر النشر. تأكد من الإنترنت وجرّب مرة ثانية.'}).then(function(){$('save').disabled=false})};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
chips();render();
firebase.initializeApp({apiKey:"AIzaSyD4J9xy2lP9ABTep8EFod4s9ipszXv5fow",authDomain:"ajerly-405e8.firebaseapp.com",projectId:"ajerly-405e8",storageBucket:"ajerly-405e8.firebasestorage.app",messagingSenderId:"267850292226",appId:"1:267850292226:web:d0555827f6f9aa4fe89b1b"});
db=firebase.firestore();
firebase.auth().signInAnonymously().then(function(c){uid=c.user.uid;render()}).catch(function(){toast('تعذر الاتصال بالخادم')});
db.collection('listings').orderBy('createdAt','desc').limit(200).onSnapshot(function(q){items=q.docs.map(function(d){var x=d.data();x.id=d.id;return x});render()},function(){var L=$('list');L.textContent='';L.appendChild(el('div','empty','تعذر تحميل الإعلانات. تأكد من الإنترنت.'))});
</script>
</body>
</html>
